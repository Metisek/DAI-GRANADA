<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            overflow-x: hidden;
        }

        .sidenav {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1000;
            top: 0;
            right: 0;
            background-color: #fff;
            overflow-x: hidden;
            transition: 0.3s ease;
            padding-top: 60px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.5);
        }

        .sidenav a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 18px;
            color: #111;
            display: block;
            transition: 0.3s;
        }

        .sidenav a:hover {
            color: #575757;
        }

        .sidenav .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }

        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.2);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 0s 1s;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 1s ease, visibility 0s 0s;
        }

        .sidenav .form-inline {
            display: flex;
            flex-direction: column; /* Ustawienie pionowe */
            align-items: stretch; /* Elementy zajmują całą szerokość */
            padding: 0 32px; /* Wyrównanie względem reszty elementów */
        }

        .sidenav .form-inline input {
            width: 100%; /* Szerokość pola tekstowego */
            margin-bottom: 10px; /* Odstęp od przycisku */
        }

        .sidenav .dropdown-menu {
            display: block;
            padding-left: 32px;
            border-width: 0px;
        }

        .sidenav .dropdown-item {
            font-size: 14px;
        }

        .sidenav .form-inline button {
            width: 100%; /* Przycisk wyszukiwania także na pełną szerokość */
        }

        #categoriesListMobile {
            display: none;
            transition: max-height 0.3s ease-in-out;
            max-height: 0;
            overflow: hidden;
        }

        #categoriesListMobile.show {
            display: block;
            max-height: 1000px;
        }

        /* Strzałka przycisku rozwijania kategorii */
        .dropdown-toggle::after {
            display: inline-block;
            margin-left: .255em;
            vertical-align: .255em;
            content: "";
            border-top: .3em solid;
            border-right: .3em solid transparent;
            border-bottom: 0;
            border-left: .3em solid transparent;
            transition: transform 0.3s ease;
            transform: rotate(-90deg); /* Domyślnie strzałka obraca się o -90 stopni */
        }

        /* Gdy menu jest rozwinięte, strzałka obraca się na 0 stopni */
        .dropdown-toggle.show::after {
            transform: rotate(0deg);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-light bg-light">
        <a class="navbar-brand" href="/">Store</a>
        <button class="navbar-toggler" type="button" onclick="openNav()">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <form class="form-inline my-2 my-lg-0 ml-auto" action="/search" method="get">
                <input class="form-control mr-sm-2" type="search" name="q" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
            </form>
            <ul class="navbar-nav ml-3">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="categoriesDropdown" role="button" aria-haspopup="true" aria-expanded="false" onclick="toggleCategories('categoriesList')">
                        Categories
                    </a>
                    <div class="dropdown-menu" aria-labelledby="categoriesDropdown" id="categoriesList"></div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/cart">Cart</a>
                </li>
                {% if isAuthenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="/login">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/register">Register</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </nav>

    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <form class="form-inline my-2 my-lg-0 ml-auto" action="/search" method="get">
            <input class="form-control mr-sm-2" type="search" name="q" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
        </form>
        <a href="/cart">Cart</a>
        {% if isAuthenticated %}
        <a href="/logout">Logout</a>
        {% else %}
        <a href="/login">Login</a>
        <a href="/register">Register</a>
        {% endif %}
        <div class="dropdown">
            <a class="dropdown-toggle" href="#" id="categoriesDropdownMobile" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" onclick="toggleCategories('categoriesListMobile')">
                Categories
            </a>
            <div class="dropdown-menu" aria-labelledby="categoriesDropdownMobile" id="categoriesListMobile"></div>
        </div>
    </div>

    <div id="overlay" class="overlay" onclick="closeNav()"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        function openNav() {
            updateSidenavWidth();
            window.addEventListener("resize", updateSidenavWidth);
            document.getElementById("overlay").classList.add("active");
        }

        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
            document.getElementById("overlay").classList.remove("active");
            window.removeEventListener("resize", updateSidenavWidth);
        }

        function updateSidenavWidth() {
            const newWidth = Math.max(250, window.innerWidth * 0.35);
            if (document.getElementById("mySidenav")){
                document.getElementById("mySidenav").style.width = (newWidth > window.innerWidth ? window.innerWidth : newWidth) + "px";
            }
            // Zamknij boczne menu, jeśli szerokość okna przekroczy 768 pikseli
            if (window.innerWidth > 768) {
                closeNav();
            }
        }

        function toggleCategories(listId) {
            const categoriesList = document.getElementById(listId);
            const dropdownToggle = document.querySelector(`#${listId} + .dropdown-toggle`);

            // Przełączamy klasę "show", aby pokazać/ukryć listę kategorii
            if (categoriesList){
            categoriesList.classList.toggle("show");
            }
            // Przełączamy klasę "show" na przycisku rozwijania, aby obrócić strzałkę
            if (dropdownToggle) {
            dropdownToggle.classList.toggle("show");
            }
        }

        $(document).ready(function() {
            $.get("/categories", function(categories) {
                categories.forEach(function(category) {
                    const formattedCategory = category.charAt(0).toUpperCase() + category.slice(1).toLowerCase();
                    const categoryItem = `<a class="dropdown-item" href="/categories/${category}">${formattedCategory}</a>`;
                    $("#categoriesList").append(categoryItem);
                    $("#categoriesListMobile").append(categoryItem);
                });
            }).fail(function() {
                console.log("Error loading categories");
            });

            // Obsługa przełączania strzałki
            $('#categoriesDropdown').on('click', function () {
                $(this).toggleClass('show');
            });

            $('#categoriesDropdownMobile').on('click', function () {
                $(this).toggleClass('show');
            });
        });
    </script>
</body>
</html>
