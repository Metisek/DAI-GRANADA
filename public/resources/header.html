<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="/">Store</a>
    <form class="form-inline my-2 my-lg-0 ml-auto">
        <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
    </form>
    <ul class="navbar-nav ml-3">
        <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="categoriesDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Categories
            </a>
            <div class="dropdown-menu" aria-labelledby="categoriesDropdown" id="categoriesList">
                <!-- Kategorie będą dodawane tutaj przez JavaScript -->
            </div>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Orders</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Logout</a>
        </li>
    </ul>
</nav>
<script>
    $(document).ready(function() {
        $.get("/categories", function(categories) {
            categories.forEach(function(category) {
                // Użyj metody replace i toLowerCase do formatowania nazwy kategorii
                const formattedCategory = category.charAt(0).toUpperCase() + category.slice(1).toLowerCase();

                $("#categoriesList").append(`
                    <a class="dropdown-item" href="/categories/${category}">${formattedCategory}</a>
                `);
            });
        }).fail(function() {
            console.log("Error loading categories");
        });
    });
</script>
